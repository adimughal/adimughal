name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adimughal
          committer_branch: output
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_display: large
          extras_css: |
            svg { background: #0d1117; border-radius: 10px; }
            h2, h3, section, .field, .row { color: #c9d1d9 !important; }
            h2 a, h3 a { color: #58a6ff !important; }
            .field svg { fill: #8b949e !important; }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css
          plugin_languages_indepth: no
          plugin_languages_skipped: chatwoot
          plugin_lines: yes
