  <text x="20" y="92"><tspan class="k">focus  </tspan>   proptech, erp, ai</text>
  <text x="20" y="118"><tspan class="k">shell  </tspan>   typescript</text>
  <text x="20" y="144"><tspan class="k">uptime </tspan>   7 years on github</text>
  <text x="20" y="170"><tspan class="k">commits</tspan>   45k+ this year</text>

  <rect x="460" y="1" width="439" height="208" rx="10" fill="#f3f8ff" stroke="#cfe2ff"/>
  <text x="480" y="34" class="p">$ top --projects</text>
  <g>
    <text x="480" y="66">ownerbase</text><rect x="600" y="55" width="200" height="12" rx="2" fill="#dbe8fb"/><rect class="bar" x="600" y="55" width="200" height="12" rx="2" fill="#0a7a6b"/><text x="815" y="66" class="p">live</text>
    <text x="480" y="92">hafiz-erp</text><rect x="600" y="81" width="200" height="12" rx="2" fill="#dbe8fb"/><rect class="bar" x="600" y="81" width="180" height="12" rx="2" fill="#0a7a6b"/><text x="815" y="92" class="p">live</text>
    <text x="480" y="118">airos.pro</text><rect x="600" y="107" width="200" height="12" rx="2" fill="#dbe8fb"/><rect class="bar" x="600" y="107" width="140" height="12" rx="2" fill="#3b82f6"/><text x="815" y="118" fill="#3b82f6">beta</text>
    <text x="480" y="144">reops</text><rect x="600" y="133" width="200" height="12" rx="2" fill="#dbe8fb"/><rect class="bar" x="600" y="133" width="120" height="12" rx="2" fill="#3b82f6"/><text x="815" y="144" fill="#3b82f6">beta</text>
